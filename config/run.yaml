# All knobs for a benchmark run. Anything not in here is hardcoded by intent.

reader:
  backend: anthropic
  # Alias requested at call time; the API returns the resolved dated snapshot
  # which is what gets pinned into manifest.json.
  model: claude-sonnet-4-5
  temperature: 0.0
  max_tokens: 1024
  # Hard guarantee: tools/web access MUST be absent. Reader constructor asserts this.

judge:
  # Short name passed to upstream evaluate_qa.py; upstream maps it to gpt-4o-2024-08-06.
  short_name: gpt-4o
  resolved_model: gpt-4o-2024-08-06
  temperature: 0.0

embeddings:
  # Used by rag-dense AND activegraph-det-embedding (same model so the
  # embedding signal is comparable across systems).
  backend: openai
  model: text-embedding-3-small

retrieval:
  # Default for rag-bm25 and rag-dense. The matrix sweeps {turn, session} for the paper.
  granularity: session   # turn | session
  top_k: 10

full_context_s:
  # Sonnet's window is large; cap kept explicit so truncation is auditable.
  token_budget: 180000
  truncation: oldest_first  # drop oldest sessions first if over budget

activegraph:
  # Mirror the turn-level RAG baselines (rag-dense/turn on `s` ≈ 2398 mean
  # context tokens; rag-bm25/turn on `s` ≈ 2525). Accuracy claims against
  # those baselines are meaningful only at a comparable token budget.
  token_budget: 2500
  # Corpus-relative thresholds, NOT tuned hyperparameters. Changing them
  # shifts the signal across the entire benchmark and must be reported.
  min_token_length: 4
  min_session_cooccurrence: 2
  max_doc_freq_fraction: 0.5
  # Radius (in turns) for global session-date temporal expansion. A relevant
  # turn pulls in its N nearest neighbors in the global chronological
  # ordering so temporal-reasoning evidence (consecutive-day turns in
  # different sessions) is preserved against lower-relevance similarity
  # matches. Default 2 is the smallest value that reliably crosses a
  # session boundary for the common 2-turn user/assistant session.
  temporal_expansion_hops: 2

systems:
  - full-context-oracle
  - full-context-s
  - rag-bm25
  - rag-dense
  - activegraph-det-lexical
  - activegraph-det-embedding

datasets:
  oracle: data/longmemeval_oracle.json
  s: data/longmemeval_s_cleaned.json

seed: 42

# Output directory for all run artifacts.
output_dir: runs
