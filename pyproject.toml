[project]
name = "activegraph-longmemeval"
version = "0.1.0"
description = "Reproducible LongMemEval benchmark harness for the ActiveGraph memory system."
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.11.*"

# Exact pins. The fully resolved set is frozen in uv.lock.
dependencies = [
    "anthropic==0.40.0",
    "openai==1.54.0",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "tqdm==4.66.5",
    "numpy==1.26.4",
    "rank-bm25==0.2.2",
    "tiktoken==0.8.0",
    "backoff==2.2.1",
    "requests==2.32.3",
    "click==8.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activegraph_lme"]

[project.scripts]
aglme = "activegraph_lme.cli:main"
